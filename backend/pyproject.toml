[project]
name = "compliance-reviewer-backend"
version = "0.1.0"
description = "MVP backend for regulatory compliance document review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pysqlite3-binary>=0.5.4",
    "sqlite-vec>=0.1.6",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    "fastembed>=0.4",
    "groq>=0.11",
    "openai>=1.40",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# E501  : long lines are fine in prose-y modules (config, prompts, models)
# B008  : FastAPI `Depends(...)` defaults are idiomatic
# UP042 : we deliberately use `class Foo(str, Enum)` for JSON-friendly enums
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
